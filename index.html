<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#25243b" />
  <title>Cozy Kitten Corner</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <style>
    html.alpha-test .decor,html.alpha-test .scene-light{display:none!important}
    html.alpha-test .scene{background:rgb(0,255,90)!important}
    html.alpha-test .pet-life-glow{display:none!important}
  </style>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("alpha-test")) document.documentElement.classList.add("alpha-test");
  </script>
</head>
<body>
  <div id="app"><main class="boot-splash"><div class="boot-logo">CK</div><h1>Cozy Kitten Corner</h1><p>Загружаем дом Luna…</p></main></div>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
window.addEventListener('error',function(e){setTimeout(function(){var a=document.getElementById('app');if(a&&a.querySelector('.boot-splash'))a.innerHTML='<main class="boot-splash boot-error"><div class="boot-logo">CK</div><h1>Cozy Kitten Corner</h1><p>Ошибка запуска: '+String(e.message||'неизвестная ошибка')+'</p><button onclick="location.reload()">Повторить</button></main>'},50)});
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
