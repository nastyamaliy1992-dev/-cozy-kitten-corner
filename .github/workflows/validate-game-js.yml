name: Validate game JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every JavaScript module
        run: |
          set -e
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          if [ -f sw.js ]; then node --check sw.js; fi
      - name: Run Luna game contract tests
        run: node --test tests/*.test.mjs
