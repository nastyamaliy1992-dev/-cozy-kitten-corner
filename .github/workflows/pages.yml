name: Deploy Cozy Kitten Corner to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript before publication
        run: |
          set -e
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.mjs
      - name: Verify approved Luna feet-locked dance video
        run: |
          test -s assets/videos/luna-dance.mp4
          echo '1e7c8fa914af2a1502a71949dba583fcf749d61dc8ba75c9fa0dc004aa04935f  assets/videos/luna-dance.mp4' | sha256sum -c -
      - name: Verify filmed Luna dance 1
        run: |
          test -s assets/videos/luna-dance-01.mp4
          echo '9e44db07ceddf7166addc7747b7991f9434ee3d2a26be7878379e6aca54720b0  assets/videos/luna-dance-01.mp4' | sha256sum -c -
      - name: Verify filmed Luna dance 2
        run: |
          test -s assets/videos/luna-dance-02.mp4
          echo 'b5208334978e3c292c0c0aa16d097f95a1c6af1f0142c4cd3decfed96b714221  assets/videos/luna-dance-02.mp4' | sha256sum -c -
      - name: Verify iPhone-compatible Luna dance 1
        run: |
          test -s assets/videos/luna-dance-01-mobile.mp4
          echo '3fac868065f2767943218dc5d6e24c60581b6882ccbc9bd273470b70d2e9e56d  assets/videos/luna-dance-01-mobile.mp4' | sha256sum -c -
      - name: Verify iPhone-compatible Luna dance 2
        run: |
          test -s assets/videos/luna-dance-02-mobile.mp4
          echo '79e2881fbb88dbe7f0cdd872308de97115b075e98b16eaa5646a72c50a9816c0  assets/videos/luna-dance-02-mobile.mp4' | sha256sum -c -
      - name: Build inline Telegram dance animations and audio
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          for clip in 01 02; do
            ffmpeg -hide_banner -loglevel error -y -i "assets/videos/luna-dance-${clip}-mobile.mp4" -an -vf 'fps=12,scale=480:-2:flags=bicubic' -c:v libwebp_anim -lossless 0 -compression_level 2 -quality 60 -loop 0 "assets/videos/luna-dance-${clip}.webp"
            ffmpeg -hide_banner -loglevel error -y -i "assets/videos/luna-dance-${clip}-mobile.mp4" -vn -c:a aac -b:a 96k -movflags +faststart "assets/videos/luna-dance-${clip}.m4a"
            test -s "assets/videos/luna-dance-${clip}.webp"
            test -s "assets/videos/luna-dance-${clip}.m4a"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
