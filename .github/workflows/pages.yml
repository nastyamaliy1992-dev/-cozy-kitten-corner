name: Deploy Cozy Kitten Corner to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify approved Luna feet-locked dance video
        run: |
          test -s assets/videos/luna-dance.mp4
          echo '1e7c8fa914af2a1502a71949dba583fcf749d61dc8ba75c9fa0dc004aa04935f  assets/videos/luna-dance.mp4' | sha256sum -c -
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
