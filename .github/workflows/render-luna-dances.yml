name: Render Luna dance videos
on:
  push:
    branches: [main]
    paths:
      - 'tools/render_luna_dance_videos.py'
      - '.github/workflows/render-luna-dances.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate Luna dance MP4 clips
        run: python tools/render_luna_dance_videos.py
      - name: Publish videos to game assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/*.mp4
          if git diff --cached --quiet; then
            echo "Videos are already up to date"
            exit 0
          fi
          git commit -m "Render Luna interactive dance MP4 clips [skip ci]"
          git push
