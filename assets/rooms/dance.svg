<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4f1e8"/><stop offset=".62" stop-color="#d9e2dd"/><stop offset="1" stop-color="#b1bcb7"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#d6bda0"/><stop offset=".57" stop-color="#e5d4bf"/><stop offset="1" stop-color="#e9dbc8"/></linearGradient>
<linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcece7"/><stop offset=".55" stop-color="#f7faf7"/><stop offset="1" stop-color="#bbd1d2"/></linearGradient>
<radialGradient id="warm"><stop stop-color="#fffbea"/><stop offset=".22" stop-color="#ffeabb"/><stop offset=".48" stop-color="#ffd89a" stop-opacity=".68"/><stop offset="1" stop-color="#ffd89a" stop-opacity="0"/></radialGradient>
<radialGradient id="cool"><stop stop-color="#f7ffff"/><stop offset=".2" stop-color="#cce9e6"/><stop offset=".46" stop-color="#9ac9cd" stop-opacity=".52"/><stop offset="1" stop-color="#9ac9cd" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
<pattern id="wood" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M0 0v160M54 0v160M110 0v160" stroke="#b99d7b" stroke-width="2" opacity=".26"/></pattern>
</defs>
<rect width="900" height="1600" fill="url(#wall)"/>
