<circle cx="662" cy="303" r="120" fill="url(#cool)"/><circle cx="662" cy="303" r="33" fill="#ecfffa"/><circle cx="662" cy="303" r="20" fill="#fff"/>
<circle cx="805" cy="208" r="88" fill="url(#warm)"/><circle cx="805" cy="208" r="24" fill="#fff8e7"/><circle cx="805" cy="208" r="14" fill="#fff"/>
